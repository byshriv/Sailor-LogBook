name: Protected Android APK
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Monotonically increasing APK version code (greater than 1)
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: android-signing
  cancel-in-progress: false
jobs:
  signed-apk:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: android-signing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require environment reviewers and protected branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/android-signing" > "$RUNNER_TEMP/environment.json"
          jq -e '.deployment_branch_policy.protected_branches == true and any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length) > 0)' "$RUNNER_TEMP/environment.json"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run scan:secrets
      - run: npm run verify:foundation
      - run: npx cap sync android
      - name: Build and verify signed review artifact
        env:
          SLB_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SLB_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SLB_SIGNING_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SLB_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SLB_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          SLB_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          [[ "$SLB_VERSION_CODE" =~ ^[0-9]+$ ]] && (( SLB_VERSION_CODE > 1 && SLB_VERSION_CODE <= 2100000000 ))
          test -n "$SLB_KEYSTORE_BASE64" && test -n "$SLB_CERT_SHA256"
          export SLB_SIGNING_STORE="$RUNNER_TEMP/logbook-signing.jks"
          trap 'rm -f "$SLB_SIGNING_STORE"' EXIT
          umask 077
          printf '%s' "$SLB_KEYSTORE_BASE64" | base64 --decode > "$SLB_SIGNING_STORE"
          chmod +x platforms/android/gradlew
          (cd platforms/android && ./gradlew :app:assembleRelease --no-daemon)
          APK=platforms/android/app/build/outputs/apk/release/app-release.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$SIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/certificate.txt"
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certificate.txt" | tr '[:upper:]' '[:lower:]')
          test "$ACTUAL" = "${SLB_CERT_SHA256,,}"
          sha256sum "$APK" > "$APK.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signed-android-review-${{ github.sha }}-${{ inputs.version_code }}
          path: |
            platforms/android/app/build/outputs/apk/release/app-release.apk
            platforms/android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 7
# Review artifacts only. No release creation, publishing, deployment or PR-triggered signing.
